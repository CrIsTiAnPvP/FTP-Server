########### Anonymous and Local Users Configuration ###########
anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp/pub
local_enable=YES
write_enable=YES
###############################################################

################ Chroot (Jail) Settings #######################
chroot_local_user=YES
allow_writeable_chroot=YES
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd/chroot_list
###############################################################

################ Miscellaneous Settings #######################
# Enable welcome message
dirmessage_enable=YES

# FTP Banner
ftpd_banner=--- Welcome to the FTP server of 'sistema.sol'---

# Set idle session timeout to 720 seconds, limit max clients to 15
idle_session_timeout=720
max_clients=15

# Bandwidth limit for authenticated users 5 MB/s
local_max_rate=5120
# Bandwidth limit for anonymous users 2 MB/s
anon_max_rate=2048

#Standalone mode
listen=YES

## Enable logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log

## Hide ids from user
hide_ids=YES

## Enable active mode
port_enable=YES
connect_from_port_20=YES
ftp_data_port=20

## PAM file name
pam_service_name=vsftpd_virtual
###############################################################

################### SSL Configuration #########################
# Enable SSL
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES

# SSL Certificate and Key files
rsa_cert_file=/etc/ssl/private/example.test.pem
rsa_private_key_file=/etc/ssl/private/example.test.pem

# SSL Protocols
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH
###############################################################